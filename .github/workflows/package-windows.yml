name: Package Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to package (for example 0.2.0-beta.1)
        required: true
        type: string
      channel:
        description: Velopack release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: gamehours-package-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Test and package GameHours (${{ inputs.channel }})
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Validate release context
        shell: pwsh
        env:
          GAMEHOURS_PRODUCTION_UPDATE_SOURCE: ${{ vars.GAMEHOURS_UPDATE_SOURCE }}
          GAMEHOURS_AZURE_SIGNING_ENDPOINT: ${{ vars.GAMEHOURS_AZURE_SIGNING_ENDPOINT }}
          GAMEHOURS_AZURE_SIGNING_ACCOUNT: ${{ vars.GAMEHOURS_AZURE_SIGNING_ACCOUNT }}
          GAMEHOURS_AZURE_SIGNING_PROFILE: ${{ vars.GAMEHOURS_AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Release packages must be built from main.'
          }

          $required = @{
            'GAMEHOURS_UPDATE_SOURCE' = $env:GAMEHOURS_PRODUCTION_UPDATE_SOURCE
            'GAMEHOURS_AZURE_SIGNING_ENDPOINT' = $env:GAMEHOURS_AZURE_SIGNING_ENDPOINT
            'GAMEHOURS_AZURE_SIGNING_ACCOUNT' = $env:GAMEHOURS_AZURE_SIGNING_ACCOUNT
            'GAMEHOURS_AZURE_SIGNING_PROFILE' = $env:GAMEHOURS_AZURE_SIGNING_PROFILE
            'AZURE_CLIENT_ID' = $env:AZURE_CLIENT_ID
            'AZURE_TENANT_ID' = $env:AZURE_TENANT_ID
            'AZURE_SUBSCRIPTION_ID' = $env:AZURE_SUBSCRIPTION_ID
          }

          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Release configuration is incomplete: $($missing -join ', ')"
          }

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GameHours.sln --locked-mode

      - name: Build
        run: dotnet build GameHours.sln -c Release --no-restore

      - name: Test
        run: dotnet test GameHours.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Authenticate to Azure for code signing
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Azure Artifact Signing metadata
        shell: pwsh
        env:
          GAMEHOURS_AZURE_SIGNING_ENDPOINT: ${{ vars.GAMEHOURS_AZURE_SIGNING_ENDPOINT }}
          GAMEHOURS_AZURE_SIGNING_ACCOUNT: ${{ vars.GAMEHOURS_AZURE_SIGNING_ACCOUNT }}
          GAMEHOURS_AZURE_SIGNING_PROFILE: ${{ vars.GAMEHOURS_AZURE_SIGNING_PROFILE }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'gamehours-signing-metadata.json'
          $metadata = [ordered]@{
            Endpoint = $env:GAMEHOURS_AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:GAMEHOURS_AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:GAMEHOURS_AZURE_SIGNING_PROFILE
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText($path, $metadata, [System.Text.UTF8Encoding]::new($false))
          "GAMEHOURS_SIGNING_METADATA=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package, sign and validate
        shell: pwsh
        env:
          GAMEHOURS_PACKAGE_VERSION: ${{ inputs.version }}
          GAMEHOURS_PACKAGE_CHANNEL: ${{ inputs.channel }}
          GAMEHOURS_PRODUCTION_UPDATE_SOURCE: ${{ vars.GAMEHOURS_UPDATE_SOURCE }}
        run: |
          ./scripts/package-windows.ps1 `
            -Version $env:GAMEHOURS_PACKAGE_VERSION `
            -Channel $env:GAMEHOURS_PACKAGE_CHANNEL `
            -UpdateSource $env:GAMEHOURS_PRODUCTION_UPDATE_SOURCE `
            -AzureTrustedSignFile $env:GAMEHOURS_SIGNING_METADATA

      - name: Attest release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: artifacts/velopack/${{ inputs.channel }}/SHA256SUMS.txt

      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gamehours-${{ inputs.version }}-win-x64-${{ inputs.channel }}
          path: artifacts/velopack/${{ inputs.channel }}/
          if-no-files-found: error
          retention-days: 14
