name: Package Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to package (for example 0.2.0-beta.1)
        required: true
        type: string
      channel:
        description: Velopack release channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: gamehours-package-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Test and package GameHours (${{ inputs.channel }})
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GAMEHOURS_GITHUB_REPOSITORY: https://github.com/${{ github.repository }}

    steps:
      - name: Validate release context
        shell: pwsh
        env:
          GAMEHOURS_AZURE_SIGNING_ENDPOINT: ${{ vars.GAMEHOURS_AZURE_SIGNING_ENDPOINT }}
          GAMEHOURS_AZURE_SIGNING_ACCOUNT: ${{ vars.GAMEHOURS_AZURE_SIGNING_ACCOUNT }}
          GAMEHOURS_AZURE_SIGNING_PROFILE: ${{ vars.GAMEHOURS_AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Release packages must be built from main.'
          }

          $required = @{
            'GAMEHOURS_AZURE_SIGNING_ENDPOINT' = $env:GAMEHOURS_AZURE_SIGNING_ENDPOINT
            'GAMEHOURS_AZURE_SIGNING_ACCOUNT' = $env:GAMEHOURS_AZURE_SIGNING_ACCOUNT
            'GAMEHOURS_AZURE_SIGNING_PROFILE' = $env:GAMEHOURS_AZURE_SIGNING_PROFILE
            'AZURE_CLIENT_ID' = $env:AZURE_CLIENT_ID
            'AZURE_TENANT_ID' = $env:AZURE_TENANT_ID
            'AZURE_SUBSCRIPTION_ID' = $env:AZURE_SUBSCRIPTION_ID
          }

          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Release configuration is incomplete: $($missing -join ', ')"
          }

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate release metadata
        shell: pwsh
        env:
          GAMEHOURS_PACKAGE_VERSION: ${{ inputs.version }}
          GAMEHOURS_PACKAGE_CHANNEL: ${{ inputs.channel }}
        run: |
          $version = $env:GAMEHOURS_PACKAGE_VERSION.Trim()
          $versionMatch = [regex]::Match(
            $version,
            '^\d+\.\d+\.\d+(?:-(?<prerelease>[0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$')

          if (-not $versionMatch.Success) {
            throw "Version '$version' is not valid SemVer."
          }

          $isPrerelease = $versionMatch.Groups['prerelease'].Success
          if ($env:GAMEHOURS_PACKAGE_CHANNEL -eq 'stable' -and $isPrerelease) {
            throw "Stable channel cannot package prerelease version '$version'."
          }
          if ($env:GAMEHOURS_PACKAGE_CHANNEL -eq 'beta' -and -not $isPrerelease) {
            throw "Beta channel requires a prerelease SemVer such as '$version-beta.1'."
          }

          $tag = "v$version"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            throw "Release tag '$tag' already exists. Release versions are immutable."
          }

          $notesPath = Join-Path $env:GITHUB_WORKSPACE "release-notes\$version.md"
          if (-not (Test-Path $notesPath -PathType Leaf)) {
            throw "Missing reviewed release notes: release-notes/$version.md"
          }

          if ([string]::IsNullOrWhiteSpace((Get-Content $notesPath -Raw))) {
            throw "Release notes are empty: release-notes/$version.md"
          }

          "GAMEHOURS_RELEASE_NOTES=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GAMEHOURS_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GameHours.sln --locked-mode

      - name: Build
        run: dotnet build GameHours.sln -c Release --no-restore

      - name: Test
        run: dotnet test GameHours.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Restore pinned .NET tools
        run: dotnet tool restore

      - name: Download previous channel release
        shell: pwsh
        env:
          GAMEHOURS_PACKAGE_CHANNEL: ${{ inputs.channel }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\velopack\$env:GAMEHOURS_PACKAGE_CHANNEL"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          $vpkArgs = @(
            'vpk', 'download', 'github',
            '--outputDir', $releaseDir,
            '--channel', $env:GAMEHOURS_PACKAGE_CHANNEL,
            '--repoUrl', $env:GAMEHOURS_GITHUB_REPOSITORY,
            '--token', $env:GITHUB_TOKEN
          )
          if ($env:GAMEHOURS_PACKAGE_CHANNEL -eq 'beta') {
            $vpkArgs += '--pre'
          }

          dotnet @vpkArgs
          if ($LASTEXITCODE -ne 0) {
            throw "vpk download github failed with exit code $LASTEXITCODE"
          }

          $hasPreviousFull = @(Get-ChildItem $releaseDir -Filter '*-full.nupkg' -File).Count -gt 0
          "GAMEHOURS_REQUIRE_DELTA=$($hasPreviousFull.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Authenticate to Azure for code signing
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Azure Artifact Signing metadata
        shell: pwsh
        env:
          GAMEHOURS_AZURE_SIGNING_ENDPOINT: ${{ vars.GAMEHOURS_AZURE_SIGNING_ENDPOINT }}
          GAMEHOURS_AZURE_SIGNING_ACCOUNT: ${{ vars.GAMEHOURS_AZURE_SIGNING_ACCOUNT }}
          GAMEHOURS_AZURE_SIGNING_PROFILE: ${{ vars.GAMEHOURS_AZURE_SIGNING_PROFILE }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'gamehours-signing-metadata.json'
          $metadata = [ordered]@{
            Endpoint = $env:GAMEHOURS_AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:GAMEHOURS_AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:GAMEHOURS_AZURE_SIGNING_PROFILE
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText($path, $metadata, [System.Text.UTF8Encoding]::new($false))
          "GAMEHOURS_SIGNING_METADATA=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package, sign and validate
        shell: pwsh
        env:
          GAMEHOURS_PACKAGE_VERSION: ${{ inputs.version }}
          GAMEHOURS_PACKAGE_CHANNEL: ${{ inputs.channel }}
        run: |
          $packageArguments = @{
            Version = $env:GAMEHOURS_PACKAGE_VERSION
            Channel = $env:GAMEHOURS_PACKAGE_CHANNEL
            ReleaseNotes = $env:GAMEHOURS_RELEASE_NOTES
            GithubUpdateRepository = $env:GAMEHOURS_GITHUB_REPOSITORY
            AzureTrustedSignFile = $env:GAMEHOURS_SIGNING_METADATA
          }
          if ($env:GAMEHOURS_REQUIRE_DELTA -eq 'true') {
            $packageArguments.RequireDelta = $true
          }

          ./scripts/package-windows.ps1 @packageArguments

      - name: Attest release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: artifacts/velopack/${{ inputs.channel }}/SHA256SUMS.txt

      - name: Upload validated package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamehours-${{ inputs.version }}-win-x64-${{ inputs.channel }}
          path: artifacts/velopack/${{ inputs.channel }}/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        env:
          GAMEHOURS_PACKAGE_VERSION: ${{ inputs.version }}
          GAMEHOURS_PACKAGE_CHANNEL: ${{ inputs.channel }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\velopack\$env:GAMEHOURS_PACKAGE_CHANNEL"
          $vpkArgs = @(
            'vpk', 'upload', 'github',
            '--outputDir', $releaseDir,
            '--channel', $env:GAMEHOURS_PACKAGE_CHANNEL,
            '--repoUrl', $env:GAMEHOURS_GITHUB_REPOSITORY,
            '--token', $env:GITHUB_TOKEN,
            '--publish',
            '--tag', $env:GAMEHOURS_RELEASE_TAG,
            '--releaseName', "GameHours $env:GAMEHOURS_PACKAGE_VERSION",
            '--targetCommitish', $env:GITHUB_SHA
          )
          if ($env:GAMEHOURS_PACKAGE_CHANNEL -eq 'beta') {
            $vpkArgs += '--pre'
          }

          dotnet @vpkArgs
          if ($LASTEXITCODE -ne 0) {
            throw "vpk upload github failed with exit code $LASTEXITCODE"
          }
