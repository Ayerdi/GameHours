name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamehours-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and package (.NET 8 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Verify SaveEngine Rust bridge
        run: |
          cargo fmt --manifest-path src/GameHours.SaveEngine/Cargo.toml -- --check
          cargo clippy --manifest-path src/GameHours.SaveEngine/Cargo.toml --locked -- -D warnings
          cargo test --manifest-path src/GameHours.SaveEngine/Cargo.toml --locked
          cargo build --manifest-path src/GameHours.SaveEngine/Cargo.toml --release --locked
          ./scripts/generate-save-engine-notices.ps1 -Check
          ./scripts/generate-save-manifest.ps1 -Check

      - name: Restore
        run: dotnet restore GameHours.sln --locked-mode

      - name: Build
        run: dotnet build GameHours.sln -c Release --no-restore

      - name: Test
        run: dotnet test GameHours.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish desktop smoke
        shell: pwsh
        run: |
          dotnet publish src/GameHours.Desktop/GameHours.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/desktop-smoke
          if (-not (Test-Path 'artifacts/desktop-smoke/tools/GameHours.SaveEngine.exe' -PathType Leaf)) { throw 'SaveEngine helper missing from publish.' }
          if (-not (Test-Path 'artifacts/desktop-smoke/tools/ludusavi-manifest.yaml' -PathType Leaf)) { throw 'Pinned Ludusavi manifest missing from publish.' }
          if (-not (Test-Path 'artifacts/desktop-smoke/THIRD-PARTY-NOTICES.md' -PathType Leaf)) { throw 'Third-party notices missing from publish.' }
          if (-not (Test-Path 'artifacts/desktop-smoke/THIRD-PARTY-RUST-LICENSES.txt' -PathType Leaf)) { throw 'Rust third-party license bundle missing from publish.' }
          $manifestHash = (Get-FileHash 'artifacts/desktop-smoke/tools/ludusavi-manifest.yaml' -Algorithm SHA256).Hash
          if ($manifestHash -ne '87E69A3CE52F1170FF35FEDA47D0041E5BE21E4195478722684C8E119469896D') { throw 'Pinned sanitized Ludusavi manifest hash validation failed.' }
          $request = '{"protocolVersion":1,"requestId":"ci-capabilities","operation":"getCapabilities","payload":{}}'
          $response = $request | & 'artifacts/desktop-smoke/tools/GameHours.SaveEngine.exe' | ConvertFrom-Json
          if (-not $response.ok -or $response.result.ludusaviRevision -ne '8844d7b67e784909f4ef42f7bfb047b700fe7b15') { throw 'Packaged SaveEngine capabilities/pin validation failed.' }

      - name: Package Velopack update-chain smoke
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        shell: pwsh
        run: |
          $repository = "https://github.com/${{ github.repository }}"
          ./scripts/package-windows.ps1 -Version "0.0.1-ci.${{ github.run_number }}.1" -Channel beta -GithubUpdateRepository $repository
          ./scripts/package-windows.ps1 -Version "0.0.1-ci.${{ github.run_number }}.2" -Channel beta -GithubUpdateRepository $repository -RequireDelta

      - name: Velopack install-uninstall recovery smoke
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\velopack\beta'
          $setup = Get-ChildItem $releaseDir -Filter '*Setup*.exe' -File | Select-Object -First 1
          if ($null -eq $setup) { throw 'Velopack Setup was not produced.' }

          $installRoot = Join-Path $env:RUNNER_TEMP 'gamehours-velopack-install'
          $dataDir = Join-Path $env:LOCALAPPDATA 'GameHours'
          $sentinel = Join-Path $dataDir 'ci-recovery-sentinel.txt'

          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          [System.IO.File]::WriteAllText($sentinel, 'preserve-me', [System.Text.UTF8Encoding]::new($false))

          function Invoke-AndWait {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [Parameter(Mandatory = $true)][string[]]$ArgumentList,
              [Parameter(Mandatory = $true)][string]$Label
            )

            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "$Label failed with exit code $($process.ExitCode)."
            }
          }

          function Assert-Installed {
            if (-not (Test-Path (Join-Path $installRoot 'current\GameHours.Desktop.exe') -PathType Leaf)) {
              throw 'Silent install did not produce current\GameHours.Desktop.exe.'
            }
            if (-not (Test-Path (Join-Path $installRoot 'Update.exe') -PathType Leaf)) {
              throw 'Silent install did not produce Update.exe.'
            }
            if (-not (Test-Path $sentinel -PathType Leaf)) {
              throw 'Install unexpectedly removed GameHours user data.'
            }
            if (Get-Process -Name 'GameHours.Desktop' -ErrorAction SilentlyContinue) {
              throw 'Silent install unexpectedly launched GameHours.'
            }
          }

          Invoke-AndWait -FilePath $setup.FullName -ArgumentList @('--silent', '--installto', $installRoot) -Label 'Silent Setup'
          Assert-Installed

          $updater = Join-Path $installRoot 'Update.exe'
          Invoke-AndWait -FilePath $updater -ArgumentList @('--silent', '--rootDir', $installRoot, 'uninstall') -Label 'Velopack uninstall'

          for ($attempt = 0; $attempt -lt 50 -and (Test-Path $installRoot); $attempt++) {
            Start-Sleep -Milliseconds 200
          }
          if (Test-Path $installRoot) { throw 'Velopack uninstall did not remove the installation root.' }
          if (-not (Test-Path $sentinel -PathType Leaf)) { throw 'Velopack uninstall removed GameHours user data.' }

          Invoke-AndWait -FilePath $setup.FullName -ArgumentList @('--silent', '--installto', $installRoot) -Label 'Silent reinstall'
          Assert-Installed

          $updater = Join-Path $installRoot 'Update.exe'
          Invoke-AndWait -FilePath $updater -ArgumentList @('--silent', '--rootDir', $installRoot, 'uninstall') -Label 'Final cleanup uninstall'
          Remove-Item $sentinel -Force

          Write-Host 'Velopack silent install/uninstall/reinstall preserved GameHours user data.'
