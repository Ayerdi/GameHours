name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamehours-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and package (.NET 8 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GameHours.sln --locked-mode

      - name: Build
        run: dotnet build GameHours.sln -c Release --no-restore

      - name: Test
        run: dotnet test GameHours.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish desktop smoke
        run: dotnet publish src/GameHours.Desktop/GameHours.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/desktop-smoke

      - name: Package Velopack update-chain smoke
        shell: pwsh
        run: |
          $source = "https://updates.example.invalid/gamehours"
          ./scripts/package-windows.ps1 -Version "0.0.1-ci.${{ github.run_number }}.1" -Channel beta -UpdateSource $source
          ./scripts/package-windows.ps1 -Version "0.0.1-ci.${{ github.run_number }}.2" -Channel beta -UpdateSource $source
          ./scripts/validate-velopack-release.ps1 -Channel beta -RequireDelta
