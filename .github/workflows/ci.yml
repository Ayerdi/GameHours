name: CI

on:
  push:
    branches:
      - feat/desktop-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 8 / Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GameHours.sln

      - name: Build
        run: dotnet build GameHours.sln -c Release --no-restore

      - name: Test
        run: dotnet test GameHours.sln -c Release --no-build --logger "console;verbosity=normal"
