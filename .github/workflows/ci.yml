name: CI

on:
  push:
    branches:
      - feat/desktop-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamehours-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and package (.NET 8 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GameHours.sln

      - name: Build
        run: dotnet build GameHours.sln -c Release --no-restore

      - name: Test
        run: dotnet test GameHours.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish desktop smoke
        run: dotnet publish src/GameHours.Desktop/GameHours.Desktop.csproj -c Release --no-restore -o artifacts/desktop-smoke

      - name: Package Velopack smoke
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "0.0.1-ci.${{ github.run_number }}" -Channel beta
